<?xml version="1.0" encoding="UTF-8"?>
<!-- Core2Keypad 多设备切换 UI 原型（审阅稿）。320x240 1:1，屏幕文字保持 ASCII。 -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="880" height="860" viewBox="0 0 880 860"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <defs>
    <clipPath id="frameClip"><rect width="320" height="240" rx="10"/></clipPath>
    <filter id="frameShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="6" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="880" height="860" fill="#06090D"/>
  <text x="64" y="56" font-size="24" letter-spacing="0" fill="#E8F2FF" text-anchor="start" font-weight="700">CORE2 PANEL — 多设备切换 UI 原型</text>
  <text x="64" y="82" font-size="11.5" letter-spacing="0" fill="#6E8699" text-anchor="start">抽屉在 MODE 右侧新增 DEVICE 按钮；每点一下在 D1 / D2 / D3 之间循环，只有被选中的那台收到鼠标消息</text>
  <text x="64" y="102" font-size="11" letter-spacing="0" fill="#3C5163" text-anchor="start">3 个槽位（按蓝牙地址记忆）· 最多 3 台同时在线 · 循环切换只改路由，不断开任何连接</text>

  <g transform="translate(64,120)">
<rect x="0" y="0" width="320" height="240" rx="10" fill="#05080C" filter="url(#frameShadow)"/>
<g clip-path="url(#frameClip)">
<rect x="0" y="0" width="320" height="240" rx="10" fill="#0A0F15"/>
<text x="14" y="19" font-size="9" letter-spacing="1.8" fill="#54677A" text-anchor="start">CORE2 PANEL</text>
<rect x="100" y="7" width="54" height="17" rx="8.5" fill="#102A38" stroke="#38BDF8" stroke-width="0.9"/>
<text x="127" y="19" font-size="7.6" letter-spacing="1" fill="#38BDF8" text-anchor="middle" font-weight="600">SLIDE</text>
<circle cx="168" cy="15.5" r="3.2" fill="#34D399"/>
<text x="176" y="18.4" font-size="8.2" letter-spacing="1.1" fill="#5FCFA6" text-anchor="start">D1</text>
<rect x="271" y="10" width="2" height="10" rx="1" fill="#7DD3FC"/><path d="M276 12 q2 3 0 6" fill="none" stroke="#7DD3FC" stroke-width="1.3" stroke-linecap="round"/><path d="M268 12 q-2 3 0 6" fill="none" stroke="#7DD3FC" stroke-width="1.3" stroke-linecap="round"/>
<text x="306" y="18.4" font-size="8.2" letter-spacing="0.6" fill="#4A6379" text-anchor="end">86%</text>
<line x1="0" y1="30" x2="320" y2="30" stroke="#16232E"/><rect x="8" y="40" width="304" height="192" rx="18" fill="#0F1922" stroke="#1B2C3A" stroke-width="1"/><path d="M146 100 L160 86 L174 100" fill="none" stroke="#31506A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M146 186 L160 200 L174 186" fill="none" stroke="#6E5828" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
