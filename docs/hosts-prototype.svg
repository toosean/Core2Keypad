  <text x="496" y="676" font-size="12" letter-spacing="0.2" fill="#7C94A8" text-anchor="start">④ 一台都没连上 · DEVICE 与状态条都显示 D1（灰）</text>

  <!-- 说明条 -->
  <g>
    <rect x="64" y="700" width="752" height="122" rx="14" fill="#0B1118" stroke="#16232E" stroke-width="1"/>
    <text x="84" y="726" font-size="11.5" letter-spacing="0" fill="#8FA6B8" text-anchor="start" font-weight="600">DEVICE 块的两种状态</text>
    <rect x="84" y="736" width="26" height="14" rx="4" fill="#0C211C" stroke="#34D399" stroke-width="1.1"/>
    <text x="116" y="747" font-size="10" letter-spacing="0" fill="#4E6478" text-anchor="start">绿色点亮：当前槽位在线，消息发得出去</text>
    <rect x="430" y="736" width="26" height="14" rx="4" fill="#0B121A" stroke="#16232E" stroke-width="1"/>
    <text x="462" y="747" font-size="10" letter-spacing="0" fill="#4E6478" text-anchor="start">灰色：空槽或离线，消息静默丢弃</text>

    <text x="84" y="776" font-size="11.5" letter-spacing="0" fill="#8FA6B8" text-anchor="start" font-weight="600">交互</text>
    <text x="130" y="776" font-size="10" letter-spacing="0" fill="#4E6478" text-anchor="start">点 DEVICE：D1 → D2 → D3 → D1 循环；只改路由，不 disconnect；选中的设备断开后保持该槽并变灰，不自动跳走</text>

    <text x="84" y="802" font-size="11.5" letter-spacing="0" fill="#8FA6B8" text-anchor="start" font-weight="600">细节</text>
    <text x="130" y="802" font-size="10" letter-spacing="0" fill="#4E6478" text-anchor="start">槽位永远显示 D1/D2/D3（没配过就在 D1）；状态条恒显示 ● D1：绿 = 该槽在线、琥珀 = 该槽离线但还有别的在线、灰 = 一台都没连</text>
  </g>
  <text x="64" y="842" font-size="10" letter-spacing="0" fill="#2E4152" text-anchor="start">屏幕文字保持 ASCII（设备只有拉丁字库）；槽位数字 1..5，状态 CONNECTED / PAIRED / EMPTY</text>
  <text x="816" y="842" font-size="10" letter-spacing="0" fill="#2E4152" text-anchor="end">审阅通过后再动 src/main.cpp —— 本图仅原型</text>
</svg>
