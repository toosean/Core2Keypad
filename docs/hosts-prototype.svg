<rect x="156" y="82" width="64" height="106" rx="16" fill="#0C211C" stroke="#34D399" stroke-width="1"/>
<rect x="177" y="105" width="22" height="3" rx="1.5" fill="#34D399"/><rect x="177" y="112" width="16" height="3" rx="1.5" fill="#34D399"/><rect x="177" y="119" width="10" height="3" rx="1.5" fill="#34D399"/><circle cx="197" cy="120.5" r="2.2" fill="#34D399"/>
