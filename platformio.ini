; Core2Keypad —— M5Stack Core2 当作 BLE HID 键盘（只有 ↑ / ↓ 两个键）
; 目标板指纹（实测）：ESP32-D0WDQ6-V3 / 16MB Flash / CH9102 串口桥 / AXP 电源

[env:m5stack-core2]
platform  = espressif32@7.0.1
board     = m5stack-core2
framework = arduino

monitor_speed = 921600
upload_speed  = 921600
upload_port   = COM6

lib_deps =
    m5stack/M5Unified@^0.3.0
